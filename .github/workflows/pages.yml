name: Deploy Sopham (Worker + Pages)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run worker:check
      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /sopham
          NEXT_PUBLIC_PICKUP_WORKER_URL: ${{ vars.NEXT_PUBLIC_PICKUP_WORKER_URL }}

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require the public Worker URL
        env:
          NEXT_PUBLIC_PICKUP_WORKER_URL: ${{ vars.NEXT_PUBLIC_PICKUP_WORKER_URL }}
        run: |
          if [ -z "$NEXT_PUBLIC_PICKUP_WORKER_URL" ]; then
            echo "::error::Set the NEXT_PUBLIC_PICKUP_WORKER_URL Actions variable before deploying."
            exit 1
          fi
      - name: Validate SVOA approval setting
        env:
          SVOA_ACCESS_APPROVED: ${{ vars.SVOA_ACCESS_APPROVED || 'false' }}
        run: |
          if [ "$SVOA_ACCESS_APPROVED" != "true" ] && [ "$SVOA_ACCESS_APPROVED" != "false" ]; then
            echo "::error::SVOA_ACCESS_APPROVED must be exactly 'true' or 'false'."
            exit 1
          fi
      - name: Build frontend
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /sopham
          NEXT_PUBLIC_PICKUP_WORKER_URL: ${{ vars.NEXT_PUBLIC_PICKUP_WORKER_URL }}
      - name: Deploy Worker
        run: npm run worker:deploy -- --var "SVOA_ACCESS_APPROVED:$SVOA_ACCESS_APPROVED"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SVOA_ACCESS_APPROVED: ${{ vars.SVOA_ACCESS_APPROVED || 'false' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Smoke test deployed Pages and Worker
        run: npm run smoke:deployment
        env:
          SMOKE_PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          NEXT_PUBLIC_PICKUP_WORKER_URL: ${{ vars.NEXT_PUBLIC_PICKUP_WORKER_URL }}
          SMOKE_ALLOWED_ORIGIN: https://keyhad.github.io
